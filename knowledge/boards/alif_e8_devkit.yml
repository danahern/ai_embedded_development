board: alif_e8_devkit
chip: ensemble-e8
family: ensemble
arch: arm-cortex-a+arm-cortex-m
vendor: alif

flash_method: setools
flash_tool: setools
probe: j-link
connect_under_reset: false
target_chip: ensemble-e8

connection:
  prg_usb: "Micro-USB — power + 2x serial (SE-UART + console)"
  se_uart: "First serial port from PRG_USB — SETOOLS programming"
  console_uart: "Second serial port from PRG_USB — UART2, 115200 baud, ttyS0"
  usb_otg: "USB OTG port — ADB gadget (separate from PRG_USB)"

notes: |
  Alif Ensemble E8 DevKit. Dual Cortex-A32 (Linux) + dual Cortex-M55 (Zephyr) + Ethos-U55 NPU.
  Yocto machine config: devkit-e8 (scarthgap branch, kernel v6.12).
  Boot chain: Secure Enclave -> TF-A -> xipImage (no U-Boot).
  Kernel runs XIP from MRAM (0x80020000) or OSPI flash. DTB at 0x80010000.
  Rootfs at 0x80380000 (higher than E7's 0x80300000).
  TF-A platform: devkit_e7 (shared with E7).
  SE firmware packages: AE822FA0E5597BS0, AE822FA0E5597LS0.
  SETOOLS config tracked in firmware/linux/alif-e8/setools/.

memory:
  mram:
    size_kb: 5760
    base: 0x80000000
    note: "TF-A + xipImage + DTB + cramfs (XIP)"
  sram:
    size_kb: 4096
    base: 0x02000000
    note: "Kernel data/BSS + stack (A32)"
  hyperram:
    size_kb: 8192
    base: 0xA0000000
    note: "Optional HyperRAM via OSPI0 (ISSI)"

peripherals: [uart, spi, i2c, i3c, usb, ethernet, adc, dac, crc, mhu, hwsem]
features: [dual-core-a32, dual-core-m55, ethos-u55-npu, xip-boot, ospi, mram, hyperram, tfa-boot, smp]
