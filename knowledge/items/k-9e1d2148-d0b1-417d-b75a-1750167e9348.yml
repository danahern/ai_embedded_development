id: k-9e1d2148-d0b1-417d-b75a-1750167e9348
title: 'Alif E7: Complete flash workflow — SE-UART for MRAM, TF-A MRAM-staging for OSPI'
body: |-
  ## Flash Workflow for Alif E7

  Two mechanisms for persistent image updates. J-Link writes don't persist (SE overwrites on boot, see k-3b471ccd).

  ### MRAM Images (TFA, DTB): SE-UART ATOC

  1. **Stage** — Copy images to `build/images/` with names matching config JSON
  2. **gen_toc** — `alif-flash.gen_toc(config="build/config/linux-boot-e7-ospi.json")` — generates ATOC package
  3. **flash** — `alif-flash.flash(config="linux-boot-e7-ospi.json", maintenance=true)` — ~5 KB/s
  4. **Power cycle** — Unplug/replug PRG_USB. SE programs MRAM from ATOC.

  ### OSPI Images (kernel, rootfs): TF-A MRAM-Staging (3-pass)

  `app-gen-toc` only supports `mramAddress`/`loadAddress` — NOT OSPI addresses. OSPI must be programmed via TF-A's MRAM-staging mechanism (see k-f579d948).

  **Pass 1** (`ospi-pass-1-kernel.json`): Stage kernel (3.6 MB) to MRAM + magic header → power cycle → TF-A programs OSPI 0xC0800000
  **Pass 2** (`ospi-pass-2-rootfs.json`): Stage rootfs (4.8 MB) to MRAM + magic header → power cycle → TF-A programs OSPI 0xC0000000
  **Pass 3** (`ospi-pass-3-final.json`): Restore normal M55 stub → power cycle → clean Linux boot

  Total: ~45-60 min (3 × gen_toc + flash + power cycle).

  ### OSPI Header Format

  16-byte header at MRAM 0x8000E000: `{ magic=0x4F535049 ("OSPI"), dest_addr, length, src_addr=0x80020000 }`
  Headers in `build/images/ospi-hdr-kernel-new.bin` and `ospi-hdr-rootfs-new.bin`. Must match file sizes exactly.

  ### Key Details

  - SE-UART port: `/dev/cu.usbserial-A10LOVM2`
  - UART2 console: `/dev/cu.usbserial-AO009AHE` at 115200
  - DEVICE entry required with correct E7 part number
  - `global-cfg.db` must match target (E7 vs E8)

  Consolidates: k-f44cd4f4, k-5a99d26d (deprecated), k-502e0e95 (OSPI programmer).
