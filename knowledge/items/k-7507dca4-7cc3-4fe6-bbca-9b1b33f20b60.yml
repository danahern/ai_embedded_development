title: 'USB FunctionFS: configfs vs legacy g_ffs kernel config'
body: 'For FunctionFS with configfs composite gadgets, use CONFIG_USB_CONFIGFS_F_FS=y (not CONFIG_USB_FUNCTIONFS=y). The legacy CONFIG_USB_FUNCTIONFS enables g_ffs which auto-binds the UDC and steals it from the composite gadget. Symptoms: ''g_ffs gadget.0: g_ffs ready'' in dmesg, ''Resource busy'' when creating ffs.adb function. Fix: CONFIG_USB_CONFIGFS_F_FS=y and ''# CONFIG_USB_FUNCTIONFS is not set'' in kernel config fragment.'
