title: JLink loadbin rejects DTB files — copy to .bin extension
body: |-
  JLink's `loadbin` command rejects .dtb (device tree blob) files with "File is of unknown / unsupported format". The DTB magic number 0xD00DFEED at the start of the file confuses JLink's format auto-detection.

  Workaround: copy the DTB to a .bin extension before loading:
  ```
  cp appkit-e7-ospi.dtb /tmp/dtb_raw.bin
  loadbin /tmp/dtb_raw.bin 0x80200000
  ```

  This works because JLink treats .bin files as raw binary without format validation.
