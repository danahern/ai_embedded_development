title: 'Alif E7: SE-UART flash and JLink operations trigger board reset — no manual power cycle needed'
body: |-
  Manual power cycle (unplug/replug PRG_USB) is NOT required after flashing. Both SE-UART flash (`alif-flash.flash`) and JLink operations (`alif-flash.jlink_flash`) trigger board resets automatically. The board reboots on its own after flash completes.

  Previously documented as "power cycle required" but the reset happens as part of the flash protocol (SE-UART sends RESET_DEVICE at end of maintenance mode, JLink resets the target after programming).

  This means flash → watch UART2 output is the correct workflow, no manual intervention needed.
