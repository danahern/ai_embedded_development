title: 'Alif E7 maintenance mode: jlink_reset=true works for fully automated entry'
body: |-
  The `maintenance` MCP tool with `jlink_reset=true` fully automates maintenance mode entry on the Alif E7. No manual power cycle or button press needed.

  Flow: JLink NSRST reset → SE reboots → tool catches ISP window → START_ISP → SET_MAINTENANCE → RESET → verify.

  This uses SetRESET/ClrRESET JLink commands which toggle NSRST directly without SWD core connection, so it doesn't disturb external FTDI adapters sharing the board's UART pins.

  Verified working 2026-03-07. Use this instead of manual "soft maintenance" for all automated flash testing.
