title: 'Alif E7 OSPI flash speed: 6.2 KB/s via JLink FLM (confirmed)'
body: |-
  JLink OSPI flash programming via Ensemble_IS25WX256.FLM flash loader runs at ~6.2 KB/s. Confirmed with 10.2 MB rootfs+kernel flash in 1624s (27 min). MRAM is ~44 KB/s by comparison.

  Key data point: 10.2 MB OSPI flash = 27 minutes. Plan accordingly for large images. The xipImage (8.2 MB) dominates — consider whether kernel can stay in MRAM to avoid the OSPI bottleneck.

  The alif-flash MCP now returns speed_kbps and per-file size_bytes in jlink_flash results for tracking.
