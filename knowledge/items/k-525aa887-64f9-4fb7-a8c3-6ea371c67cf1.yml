id: k-525aa887-64f9-4fb7-a8c3-6ea371c67cf1
title: CONFIG_USB_G_SERIAL auto-binds UDC — must force-disable via sed in do_configure_append
body: |-
  When `CONFIG_USB_G_SERIAL=y` is set in the kernel, the g_serial gadget driver auto-binds the UDC at boot. This prevents any configfs composite gadget (like ADB + CDC-ECM) from binding, since the UDC is already claimed.

  **Problem**: Adding `# CONFIG_USB_G_SERIAL is not set` to a kernel config fragment does NOT reliably override it. The Alif kernel's defconfig or `make olddefconfig` re-enables it. The official `meta-alif-ensemble/recipes-kernel/linux/files/apss-tiny/usb.cfg` explicitly sets `CONFIG_USB_G_SERIAL=y`.

  **Fix**: Use `do_configure_append()` in the bbappend to sed it out AFTER all config merging:

  ```bitbake
  do_configure_append() {
      sed -i 's/^CONFIG_USB_G_SERIAL=.*/# CONFIG_USB_G_SERIAL is not set/' ${B}/.config
  }
  ```

  This runs after `do_kernel_configme` / `merge_config.sh` / `make olddefconfig`, guaranteeing the override sticks.

  **Verified**: After adding the sed, `CONFIG_USB_G_SERIAL` was gone from `.config` and the configfs composite gadget (ADB + CDC-ECM) successfully bound to UDC `48200000.usb-dual`.
