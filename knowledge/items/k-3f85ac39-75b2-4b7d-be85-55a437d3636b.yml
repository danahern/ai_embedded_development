title: Segger JLink official device definitions for Alif E7 and E8
body: |-
  Segger has official Alif device definitions at https://www.segger.com/supported-devices/alifsemiconductor/

  Device names for JLink operations (JLinkExe, J-Link GDB Server, etc.):

  **E7** (AE722F80F55D5):
  - `AE722F80F55D5_A32_0` — Cortex-A32 core 0
  - `AE722F80F55D5_A32_1` — Cortex-A32 core 1
  - `AE722F80F55D5_HP` — M55 High Performance
  - `AE722F80F55D5_HE` — M55 High Efficiency

  **E8 BS0 variant** (AE822FA0E5597BS0):
  - `AE822FA0E5597BS0_A32_0`, `_A32_1` — Cortex-A32 cores
  - `AE822FA0E5597BS0_M55_HP`, `_M55_HE` — M55 cores

  **E8 LS0 variant** (AE822FA0E5597LS0):
  - `AE822FA0E5597LS0_A32_0`, `_A32_1` — Cortex-A32 cores
  - `AE822FA0E5597LS0_M55_HP`, `_M55_HE` — M55 cores

  Installed at `~/Library/Application Support/SEGGER/JLinkDevices/AlifSemi/`.

  Use the `_A32_0` variant for direct JTAG memory reads of MRAM, SRAM, and OSPI XIP regions — avoids the limitations of the custom probe-rs target YAML which only supports M55.
