title: 'Alif E7 AppKit: Fixed dual-serial setup — no jumper switching needed'
body: |-
  The Alif E7 AppKit can run with a **fixed serial setup** that eliminates J15 jumper switching:

  **Hardware setup:**
  - **J15 jumpers**: Permanently on UART2 position (pins 5-7/6-8)
  - **External FTDI adapter**: Connected to SE-UART header for ISP flash protocol

  **Port mapping (macOS):**
  | Port | Device | Use | Baud |
  |------|--------|-----|------|
  | `/dev/cu.usbserial-*` | External FTDI | SE-UART ISP flash | 57600 |
  | `/dev/cu.usbmodem*` | Onboard JLink VCOM | Linux console + TF-A | 115200 |

  **Benefits:**
  - No physical jumper changes between flash and console operations
  - Both ports available simultaneously
  - alif-flash MCP auto-detects: `usbserial` for ISP, `usbmodem` for monitoring

  **VCOM caveat:** JLink VCOM only produces output during an active JLink debug session. After power cycle, connect JLink first, then monitor VCOM.

  **Previous setup** required switching J15 between SE-UART (for flashing) and UART2 (for console). The external FTDI adapter eliminates this.
