title: 'kernel_rebuild MCP tool: correct sequence for kernel config fragment changes'
body: |-
  The `kernel_rebuild` tool in linux-build MCP runs the correct forced rebuild sequence: `configure -f → compile -f → deploy -f`. This is needed because:

  1. `cleansstate` does NOT delete build artifacts in `work-shared/devkit-e8/kernel-source/`
  2. `compile -f` alone runs Make with stale .o files whose timestamps are newer than .config
  3. Make sees nothing to do and skips recompilation — binary is NOT rebuilt
  4. `configure -f` MUST run first to regenerate `include/config/auto.conf`, which forces kbuild to see new config options

  Usage:
  ```
  linux-build.kernel_rebuild(
    container="yocto-build",
    image="alif-tiny-image",
    verify_configs=["CONFIG_JFFS2_FS=y"]
  )
  ```

  For recipe-only changes (bbappend, bb files), use `yocto_build` instead — no forced reconfig needed.

  Background mode available via `background=true`, status checked with `yocto_build_status`.
