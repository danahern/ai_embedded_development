title: Alif DevKit-e7 board config — UART, OSPI, LED, I2C assignments
body: |-
  From SDK `Boards/DevKit-e7/board_defs.h`:

  **UART**: UARTA=UART2 (console), UARTB=UART4, Clickboard=UART0
  **I2C**: I2C0 (clickboard + slave), I2C1 (camera + master)
  **OSPI flash**: OSPI1, reset GPIO Port 15 Pin 7
  **OSPI PSRAM/HyperRAM**: OSPI0, reset GPIO Port 15 Pin 6
  **Flash size**: 32 MB (IS25WX256), PSRAM size: 32 MB
  **OSPI bus speed**: 100 MHz both instances
  **Joystick**: GPIO Port 15, Pins 0–4 (A, B, C, D, Center)
  **LCD Reset**: GPIO Port 15 Pin 5
  **RGB LED0**: R=Port12/Pin3 (UTIMER ch9), G=Port7/Pin4 (UTIMER ch10), B=UTIMER ch8
  **I3C header**: present

  **DMA**: UARTs 0–3 hardwired to DMA0. UARTs 4–7 flexible (DMA0 or DMA1). LP peripherals on DMA2.
