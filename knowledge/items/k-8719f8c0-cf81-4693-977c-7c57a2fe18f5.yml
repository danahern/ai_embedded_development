title: Try SETOOLS maintenance mode programmatically before asking user
body: The SETOOLS `./maintenance` tool can enter hard maintenance mode programmatically — run it with menu selections "1\n1\n" (Device Control → Hard maintenance mode). Try this first before asking the user to manually enter maintenance mode. Only ask the user to intervene if the programmatic attempt fails (e.g., "Waiting for Target" timeout or "Malformed packet" errors). After entering maintenance mode, flash with `./app-write-mram -v -p -nr -b 57600`.
