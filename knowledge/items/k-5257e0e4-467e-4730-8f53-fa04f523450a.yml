title: 'USB-to-OSPI flasher: OSPI programming verified at 46.3 KB/s'
body: |-
  The alif_usb-to-ospi-flasher (M55_HP firmware) programs OSPI NOR via USB CDC-ACM + XMODEM at 46.3 KB/s. Combined image (rootfs 8MB padded + kernel 3.7MB = 12.1MB) transferred in 256 seconds.

  Flasher CDC-ACM port: /dev/cu.usbmodem12001 (VID 0x0525, PID 0xa4a7, serial "1200") on SOC USB connector.

  CRITICAL: Flasher firmware calls SERVICES_set_run_cfg(USB_PHY_MASK) which hangs the SE. After flasher boots:
  - ISP START_ISP gets no response
  - JLink can't find M55_HE (AP[4] inaccessible)
  - JLink can't halt M55_HP
  - JLink NSRST doesn't fix it (USB PHY hardware state persists across soft reset)

  Recovery requires: hard maintenance mode via native Alif Security Toolkit + full MRAM erase + power cycle. No automated recovery path exists.
