id: k-f44cd4f4-0e8e-475c-b155-04c7c0924acb
title: 'TF-A OSPI flash programmer: MRAM staging with status register polling'
body: |-
  The Alif E7 AppKit TF-A includes an OSPI NOR flash programmer that copies data from MRAM to OSPI on boot. This enables programming the OSPI flash without JLink (which can't access OSPI due to M55_HP LOCKUP).

  Trigger mechanism: 16-byte header at MRAM 0x8000E000:
    struct ospi_prog_hdr { magic=0x4F535049 ("OSPI"), dest_addr, length, src_addr }

  Usage flow:
  1. Write kernel to MRAM at 0x80020000 via SE-UART
  2. Write header to MRAM at 0x8000E000 via SE-UART (use isp_write_hdr.py)
  3. Power cycle → TF-A sees magic → erases + programs OSPI → clears magic → re-inits XIP → boots
  4. Subsequent boots: no magic → skip programming → boot from OSPI XIP

  Performance: ~2.2MB kernel programs in ~15s (erase ~10s + program ~4s) using status register polling.

  Key implementation details:
  - Must call ospi_init() after ospi_xip_exit() before any SPI commands (restores rx_sample_dly=4)
  - Status register polling (0x05, WIP bit 0) — NOT Flag Status Register (0x70, Micron-only)
  - DFS=8 for reads (status register), DFS=16 for writes (erase/program)
  - Software Reset + full re-init after programming for reliable XIP re-entry
  - Build: FLASH_EN=1 AES_EN=0 PRELOADED_BL33_BASE=0xC0100000

  The alif-flash MCP server supports OSPI_HDR config entries via generic key handling in flash_from_config().
