id: k-5f042615-ca84-4705-9cfe-65808675fef8
title: 'Alif TF-A vars differ by branch: HYPRAM_EN (devkit-ex-b0) vs AP_HYPERRAM_EN (scarthgap)'
body: |-
  The TF-A (Trusted Firmware-A) build variables differ between branches of `alif_arm-tf`:

  **devkit-ex-b0 branch (correct for E7 AppKit):**
  - `HYPRAM_EN=1` — enable HyperRAM
  - `FLASH_EN=0` — disable flash
  - `TRUSTED_SRAM1=0x08000000`
  - `ENABLE_PIE=1`
  - `ENABLE_STACK_PROTECTOR=strong`

  **scarthgap branch (wrong for E7 AppKit):**
  - `AP_HYPERRAM_EN=0/1` — different variable name
  - `ISSI_HYPERRAM_EN=0` — additional variable
  - `MX_FLASH_EN=0`, `ISSI_FLASH_EN=0` — split flash control
  - `ALIF_TRUSTED_SRAM_BASE=0x027DE000` — different SRAM base
  - No `ENABLE_PIE`, no `ENABLE_STACK_PROTECTOR`

  **Impact:** Using scarthgap TF-A with E7 AppKit causes TF-A to crash in `devkit_e7_clocks_init()` at PERIPH_CLK_ENA register (0x4902F03C) with a data abort. The wrong SRAM base and missing PIE/stack-protector settings cause memory corruption.
category: toolchain
severity: critical
applies_to:
