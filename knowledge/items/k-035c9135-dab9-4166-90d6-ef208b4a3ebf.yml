id: k-035c9135-dab9-4166-90d6-ef208b4a3ebf
title: Alif E7 UART2 clock is 100 MHz, not 1.8432 MHz
body: |-
  The Alif E7 UART2 peripheral clock is 100 MHz (same as arch_timer). Verified by reading TF-A's baud rate divisor via JLink:

  - DLL register = 0x36 (decimal 54)
  - `uartclk = 16 * divisor * baudrate = 16 * 54 * 115200 = 99,532,800 ≈ 100 MHz`

  When patching DTB for standalone UART (without psclks clock provider), use `clock-frequency = <100000000>` in the UART node.

  base_baud reported by kernel: 6250000 (= 100MHz / 16).
