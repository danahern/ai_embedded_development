title: 'USB configfs composite: create ALL functions before linking to config'
body: 'When building a USB composite gadget via configfs, create ALL function directories (ecm.usb0, ffs.adb, etc.) BEFORE linking any of them to the configuration (ln -sf to configs/c.1/). Linking a function to config partially locks the gadget structure, causing ''Resource busy'' errors when trying to create additional functions afterward. Order: (1) mkdir all functions, (2) ln -sf all to config, (3) mount FunctionFS, (4) start adbd, (5) wait for ep1, (6) bind UDC.'
