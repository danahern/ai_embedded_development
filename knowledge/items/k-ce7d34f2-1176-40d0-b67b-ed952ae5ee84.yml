title: Alif SETOOLS SE-UART baud rate is 57600
body: The Alif SETOOLS (maintenance, app-write-mram, app-gen-toc) communicate with the Secure Enclave UART at 57600 baud, not the default 55000. Set `baudrate 57600` in `isp_config_data.cfg`. The config file also needs the correct `comport` path (e.g., `/dev/cu.usbmodem0012193076991` on macOS). Without the correct baud rate, tools fail with "Malformed packet received from target".
