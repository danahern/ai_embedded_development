title: 'CLAUDE.md DRY-up pattern: hooks enforce, rules define, CLAUDE.md sets policy'
body: |-
  The three-tier knowledge system works best when each tier has a distinct role:
  - **CLAUDE.md** (Tier 1): Only cross-cutting policy and gotchas (~6 items). Target under 8KB. Anything board/platform-specific belongs in Tier 2.
  - **`.claude/rules/*.md`** (Tier 2): Board/platform-specific rules with `paths:` frontmatter for targeted auto-injection. Use YAML frontmatter `paths: ["glob1", "glob2"]` to scope when rules load.
  - **Hooks** (enforcement): PreToolUse hooks enforce policies that CLAUDE.md declares. "Hooks enforce, rules define, CLAUDE.md sets policy."

  Trimming CLAUDE.md from ~13KB/38 gotchas to ~6KB/6 gotchas significantly reduces context dilution. The removed gotchas still exist in Tier 2 rules and Tier 3 knowledge items — they auto-inject when editing relevant files.
