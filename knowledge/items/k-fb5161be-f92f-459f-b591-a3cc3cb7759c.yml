id: k-fb5161be-f92f-459f-b591-a3cc3cb7759c
title: Alif E8 kernel is in different repo than E7
body: |-
  E7 kernel: `alifsemi/alif_linux` (branch `devkit-b0-5.4.y`, kernel 5.4.x)
  E8 kernel: `alifsemi/linux_alif` (branch `v6.12-dev`, kernel 6.12.6)

  Note the repo names are swapped (`alif_linux` vs `linux_alif`). This is NOT a typo — they are genuinely different repositories. The E8 repo has E8 device trees (devkit-e8.dts, appkit-e8.dts) and defconfigs (devkit_e8_defconfig). The E7 repo does NOT have a v6.12-dev branch.

  Submodules in workspace: `alif_linux/` (E7) and `linux_alif/` (E8).
